services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopee-tw-monitor:local
    init: true
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
      TZ: Asia/Taipei
    volumes:
      - shopee_data:/app/data
      - shopee_prompts:/app/prompts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  shopee_data:
  shopee_prompts:
