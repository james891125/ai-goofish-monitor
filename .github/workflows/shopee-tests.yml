name: Shopee Taiwan tests
on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/shopee-tw-migration]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -m "not live" -q
      - run: npm ci
        working-directory: web-ui
      - run: npm test
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fork image
        run: docker build --tag shopee-tw-monitor:test .
      - name: Verify container health and protected API
        shell: bash
        run: |
          password=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$password"
          docker run -d --name shopee-test -p 127.0.0.1:8000:8000 -e WEB_USERNAME=ci -e WEB_PASSWORD="$password" shopee-tw-monitor:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/shopee/tasks)" = 401
          curl --fail --silent -c /tmp/shopee-cookies -H 'Content-Type: application/json' --data "{\"username\":\"ci\",\"password\":\"$password\"}" http://127.0.0.1:8000/auth/status
          curl --fail --silent -b /tmp/shopee-cookies http://127.0.0.1:8000/api/shopee/status
      - name: Container logs on failure
        if: failure()
        run: docker logs shopee-test
